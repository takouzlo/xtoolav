{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title">{% trans %}Anmelden{% endtrans %}</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">{% trans %}Benutzername{% endtrans %}</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{% trans %}Passwort{% endtrans %}</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary">{% trans %}Anmelden{% endtrans %}</button>
                    <a href="{{ url_for('register') }}" class="btn btn-outline-secondary">{% trans %}Registrieren{% endtrans %}</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

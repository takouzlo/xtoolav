<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rapport xtoolav</title>
    <style>
        body { font-family: Arial; margin: 2cm; }
        .header { text-align: center; border-bottom: 2px solid #0056b3; padding-bottom: 10px; }
        .logo { max-height: 60px; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th { background: #0056b3; color: white; text-align: left; }
        td, th { padding: 8px; border: 1px solid #ddd; }
        .footer { margin-top: 50px; font-size: 0.9em; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <img src="{{ data.company_logo }}" class="logo" alt="xtoolav">
        <h2>Rapport Technique AV</h2>
        <p><strong>Client :</strong> {{ data.user }} | <strong>Date :</strong> {{ data.date }}</p>
    </div>

    <h3>Derniers calculs</h3>
    <table>
        <thead>
            <tr>
                <th>Type</th>
                <th>Détail</th>
                <th>Résultat</th>
                <th>Heure</th>
            </tr>
        </thead>
        <tbody>
            {% for c in data.calculations %}
            <tr>
                <td>{{ c.type }}</td>
                <td>{{ c.input }}</td>
                <td>{{ c.result|safe }}</td>
                <td>{{ c.timestamp }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="footer">
        <p>xtoolav.com • Rapport généré automatiquement • Confidentiel</p>
    </div>
</body>
</html>
